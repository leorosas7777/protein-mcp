[project]
name = "protein-mcp"
version = "0.1.0"
description = "Local MCP server for Claude Desktop: resolves a protein and gathers literature (Europe PMC), structures (RCSB PDB, AlphaFold DB) and ligands (ChEMBL) with source links."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "MDAnalysis>=2.11.0",
    "gemmi>=0.7.5",
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "meeko>=0.8.0,<0.9",
    "numpy>=2.5.4",
    "rdkit>=2026.9.1",
    "reportlab>=5.0.1",
    "scipy>=1.18.1",
    "tomli>=2.5.0",
    "tqdm>=4.70.1",
]

[project.scripts]
protein-mcp = "protein_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protein_mcp"]

[dependency-groups]
dev = [
    "spyrmsd>=0.9.0",
]
